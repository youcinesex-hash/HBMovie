name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter app skeleton
        run: |
          flutter create . --platforms=android --project-name hb_movie

      - name: Replace main app file
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:html/parser.dart' as html_parser;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:video_player/video_player.dart';
          import 'package:chewie/chewie.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const HBMovieApp());
          }

          class HBMovieApp extends StatelessWidget {
            const HBMovieApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'HB Movie',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0A0C13),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFE50914),
                    surface: Color(0xFF141724),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class ChannelItem {
            final String name;
            final String url;
            ChannelItem({required this.name, required this.url});

            Map<String, dynamic> toJson() => {'name': name, 'url': url};

            factory ChannelItem.fromJson(Map<String, dynamic> json) =>
                ChannelItem(name: json['name'], url: json['url']);
          }

          class ResolverService {
            static Future<String?> extractVideoStream(String url) async {
              final lower = url.toLowerCase();
              if (lower.endsWith('.m3u8') || lower.endsWith('.mp4')) return url;

              try {
                final response = await http.get(
                  Uri.parse(url),
                  headers: {
                    'User-Agent':
                        'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  },
                ).timeout(const Duration(seconds: 10));

                if (response.statusCode == 200) {
                  final document = html_parser.parse(response.body);
                  final source = document.querySelector('video source');
                  if (source != null && source.attributes.containsKey('src')) {
                    return source.attributes['src'];
                  }
                  final video = document.querySelector('video');
                  if (video != null && video.attributes.containsKey('src')) {
                    return video.attributes['src'];
                  }
                  final regex = RegExp(r'(https?:\/\/[^\s"\x27]+\.(m3u8|mp4)[^\s"\x27]*)');
                  final match = regex.firstMatch(response.body);
                  if (match != null) return match.group(0);
                }
              } catch (_) {}
              return null;
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            List<ChannelItem> _channels = [];
            final TextEditingController _urlCtrl = TextEditingController();
            final TextEditingController _nameCtrl = TextEditingController();
            bool _isLoading = false;

            @override
            void initState() {
              super.initState();
              _loadChannels();
            }

            Future<void> _loadChannels() async {
              final prefs = await SharedPreferences.getInstance();
              final data = prefs.getStringList('hb_channels');
              if (data != null) {
                setState(() {
                  _channels = data.map((i) => ChannelItem.fromJson(jsonDecode(i))).toList();
                });
              } else {
                _channels = [
                  ChannelItem(
                    name: "Big Buck Bunny (HLS)",
                    url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                  ),
                  ChannelItem(
                    name: "Tears of Steel (MP4)",
                    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                  )
                ];
              }
            }

            Future<void> _saveChannels() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList(
                'hb_channels',
                _channels.map((c) => jsonEncode(c.toJson())).toList(),
              );
            }

            void _addChannelDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF141724),
                  title: const Text("Adicionar Canal / Fonte"),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(
                        controller: _nameCtrl,
                        decoration: const InputDecoration(labelText: "Nome"),
                      ),
                      const SizedBox(height: 10),
                      TextField(
                        controller: _urlCtrl,
                        decoration: const InputDecoration(labelText: "URL (.m3u8 ou site)"),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text("Cancelar"),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(
                        backgroundColor: const Color(0xFFE50914),
                      ),
                      onPressed: () {
                        if (_urlCtrl.text.isNotEmpty) {
                          setState(() {
                            _channels.add(ChannelItem(
                              name: _nameCtrl.text.isEmpty
                                  ? "Fonte ${_channels.length + 1}"
                                  : _nameCtrl.text,
                              url: _urlCtrl.text.trim(),
                            ));
                          });
                          _saveChannels();
                          _nameCtrl.clear();
                          _urlCtrl.clear();
                          Navigator.pop(ctx);
                        }
                      },
                      child: const Text("Salvar", style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }

            Future<void> _openPlayer(ChannelItem channel) async {
              setState(() => _isLoading = true);
              final stream = await ResolverService.extractVideoStream(channel.url);
              setState(() => _isLoading = false);

              if (stream != null && mounted) {
                Navigator.push(
                  context,
                  MaterialPageRoute(
                    builder: (_) => PlayerScreen(title: channel.name, videoUrl: stream),
                  ),
                );
              } else if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    backgroundColor: Colors.red,
                    content: Text("Não foi possível carregar o vídeo."),
                  ),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'HB MOVIE',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                      color: Color(0xFFE50914),
                    ),
                  ),
                  backgroundColor: const Color(0xFF0F111A),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.add_link),
                      onPressed: _addChannelDialog,
                    ),
                  ],
                ),
                body: _isLoading
                    ? const Center(
                        child: CircularProgressIndicator(color: Color(0xFFE50914)),
                      )
                    : ListView.builder(
                        padding: const EdgeInsets.all(16),
                        itemCount: _channels.length,
                        itemBuilder: (context, index) {
                          final item = _channels[index];
                          return Card(
                            color: const Color(0xFF141724),
                            margin: const EdgeInsets.only(bottom: 12),
                            child: ListTile(
                              leading: const Icon(
                                Icons.play_circle_fill,
                                color: Color(0xFFE50914),
                                size: 36,
                              ),
                              title: Text(
                                item.name,
                                style: const TextStyle(fontWeight: FontWeight.bold),
                              ),
                              subtitle: Text(
                                item.url,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                              ),
                              trailing: IconButton(
                                icon: const Icon(Icons.delete_outline, color: Colors.grey),
                                onPressed: () {
                                  setState(() => _channels.removeAt(index));
                                  _saveChannels();
                                },
                              ),
                              onTap: () => _openPlayer(item),
                            ),
                          );
                        },
                      ),
              );
            }
          }

          class PlayerScreen extends StatefulWidget {
            final String title;
            final String videoUrl;

            const PlayerScreen({
              super.key,
              required this.title,
              required this.videoUrl,
            });

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late VideoPlayerController _videoPlayerController;
            ChewieController? _chewieController;

            @override
            void initState() {
              super.initState();
              _initPlayer();
            }

            Future<void> _initPlayer() async {
              _videoPlayerController =
                  VideoPlayerController.networkUrl(Uri.parse(widget.videoUrl));
              await _videoPlayerController.initialize();

              _chewieController = ChewieController(
                videoPlayerController: _videoPlayerController,
                autoPlay: true,
                looping: false,
                allowFullScreen: true,
                fullScreenByDefault: true,
              );
              setState(() {});
            }

            @override
            void dispose() {
              _videoPlayerController.dispose();
              _chewieController?.dispose();
              SystemChrome.setPreferredOrientations([
                DeviceOrientation.portraitUp,
                DeviceOrientation.landscapeLeft,
                DeviceOrientation.landscapeRight,
              ]);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  title: Text(widget.title),
                  backgroundColor: Colors.transparent,
                ),
                body: Center(
                  child: _chewieController != null &&
                          _chewieController!
                              .videoPlayerController.value.isInitialized
                      ? Chewie(controller: _chewieController!)
                      : const CircularProgressIndicator(
                          color: Color(0xFFE50914),
                        ),
                ),
              );
            }
          }
          EOF

      - name: Update project config
        run: |
          cat > pubspec.yaml <<'EOF'
          name: hb_movie
          description: "HB Movie - Media Center"
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            video_player: ^2.8.2
            chewie: ^1.7.4
            http: ^1.2.0
            html: ^0.15.4
            shared_preferences: ^2.2.2
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hb-movie-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
